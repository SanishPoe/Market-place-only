name: Check car-guide API sources
on:
  push:
    branches: [guide-source-probe]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official public product pages
        run: |
          mkdir -p guide-probe
          python3 - <<'PY'
          import urllib.request, pathlib, json, concurrent.futures, re
          targets=[
            ('redbook-group','https://www.redbookgroup.com/'),
            ('carsales-business','https://business.carsales.com.au/'),
            ('carsales-developer','https://developer.carsales.com.au/'),
            ('redbook-nz','https://www.redbook.co.nz/'),
            ('autograb-home','https://www.autograb.com.au/'),
            ('autograb-docs','https://docs.autograb.com.au/')]
          def get(target):
            name,url=target
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'MarketOnly-source-check/1.0'})
              with urllib.request.urlopen(request,timeout=20) as response:
                data=response.read(3000000);pathlib.Path('guide-probe',name+'.html').write_bytes(data)
                text=data.decode('utf-8',errors='replace')
                links=sorted(set(re.findall(r'href=["\x27]([^"\x27]+)',text)))
                hits=[p for p in re.findall(r'.{0,160}(?:API|api|data feed|business|Business|corporate|Corporate).{0,240}',text)][:30]
                return {'name':name,'status':response.status,'url':response.url,'bytes':len(data),'links':[p for p in links if re.search('api|data|business|corporate|industry|contact|redbook|valuation|developer',p,re.I)],'snippets':hits}
            except Exception as e:return {'name':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:rows=list(pool.map(get,targets))
          pathlib.Path('guide-probe/results.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: car-guide-api-probe
          path: guide-probe/
          retention-days: 2
